[package]
name = "chain-frg"
version = "0.1.0"
edition = "2021"

[dependencies]
chain = { path = "../chain" }
prover = { path = "../prover" }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
base64 = "0.22"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3.2"
