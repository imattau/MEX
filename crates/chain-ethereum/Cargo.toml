[package]
name = "chain-ethereum"
version = "0.1.0"
edition = "2021"

[dependencies]
chain = { path = "../chain" }
prover = { path = "../prover" }
batcher = { path = "../batcher" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
alloy = "2.3.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1.44"
sled = "0.34.7"

[dev-dependencies]
tempfile = "3.27.0"
