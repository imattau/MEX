[package]
name = "agent-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
engine = { path = "../engine" }
protocol = { path = "../protocol" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
tower = { version = "0.5", features = ["util"] }
rand = "0.8"
lru = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
chain-ethereum = { version = "0.1.0", path = "../chain-ethereum" }
trader-client = { version = "0.1.0", path = "../trader-client" }
alloy = "2.3.0"
hex = "0.4.3"
chain = { version = "0.1.0", path = "../chain" }
