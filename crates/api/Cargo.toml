[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
engine = { path = "../engine" }
validation = { path = "../validation" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
tower = { version = "0.5", features = ["util", "limit"] }
tracing = "0.1"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
reputation = { path = "../reputation" }
orderlog = { path = "../orderlog" }
protocol = { path = "../protocol" }
hex = "0.4.3"
batcher = { version = "0.1.0", path = "../batcher" }
chain = { version = "0.1.0", path = "../chain" }
chain-ethereum = { version = "0.1.0", path = "../chain-ethereum" }
alloy = "2.3.0"
tracing-subscriber = "0.3.23"
ed25519-dalek = "2"
rand = "0.8"

[dev-dependencies]
futures-util = "0.3.33"
reqwest = { version = "0.13", features = ["json"] }
tokio-tungstenite = "0.24"
