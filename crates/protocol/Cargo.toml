[package]
name = "protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
security = { path = "../security" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["net", "sync", "time", "macros", "rt"] }
tracing = "0.1"
bincode = "1.3"
lru = "0.12"
validation = { path = "../validation" }
reputation = { path = "../reputation" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
prover = { path = "../prover" }
orderlog = { path = "../orderlog" }
sha2 = "0.10"

[dev-dependencies]
tracing-subscriber = "0.3"
rand = "0.8"
