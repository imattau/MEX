[package]
name = "trader-client"
version = "0.1.0"
edition = "2021"

[dependencies]
chain = { path = "../chain" }
chain-ethereum = { path = "../chain-ethereum" }
engine = { path = "../engine" }
common = { path = "../common" }
orderlog = { path = "../orderlog" }
protocol = { path = "../protocol" }
alloy = "2.3.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "rt-multi-thread"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
tracing = "0.1.44"
prover = { version = "0.1.0", path = "../prover" }
reqwest = { version = "0.13.4", features = ["json"] }
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
