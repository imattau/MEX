name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: build, test, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and target dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Deliberately NOT installing libibverbs-dev here: crates/rdma's
      # build.rs probes for it and, if present, compiles in the real
      # soft-RDMA backend AND its test (test_soft_rdma_self_read, gated
      # on cfg(soft_rdma_available)) -- which needs actual loopback RDMA
      # (soft-RoCE/rxe kernel module) to pass, not just the userspace
      # library. A generic GitHub Actions runner has the library
      # installable but not that kernel support, so installing it here
      # made this job fail for real (confirmed: it did, see run
      # 31315852768). Leaving it uninstalled keeps build.rs on its
      # documented mock fallback, which this job CAN actually verify.
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo build --workspace --all-targets
        run: cargo build --workspace --all-targets

      # No -D warnings: this codebase has pre-existing clippy warnings
      # not yet triaged (see the production-readiness audit). This gate
      # is about catching new *errors*, not enforcing lint-clean status
      # retroactively -- tightening it to deny warnings is a separate,
      # deliberate follow-up once the existing ones are addressed.
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace

  contracts:
    name: hardhat compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: npm ci
        run: npm ci

      - name: hardhat compile
        run: npx hardhat compile

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Written without a local Docker daemon available to test it
      # against -- this job IS the verification. If it goes red, the
      # Dockerfile is wrong, not this comment.
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mex-api:ci
